<form class="form-horizontal"
      autocomplete="off"
      #contentForm="ngForm"
      (ngSubmit)="save()">
    <abp-modal-header [title]="'CourseContent' | localize"
                      (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
      
            
                <div class="form-group row required">
                    <label class="col-md-3 col-form-label" for="name">
                        {{ "NameAr" | localize }}
                    </label>
                    <div class="col-md-9">
                        <textarea type="text"
                               class="form-control"
                               name="nameAr"
                               id="nameAr"
                               required
                               minlength="2"
                               
                               [(ngModel)]="content.nameAr"
                               #nameArModel="ngModel"
                               #nameArEl ></textarea>
                        <abp-validation-summary [control]="nameArModel"
                                                [controlEl]="nameArEl"></abp-validation-summary>
                    </div>
                </div>
                <div class="form-group row required">
                    <label class="col-md-3 col-form-label" for="displayName">
                        {{ "NameEn" | localize }}
                    </label>
                    <div class="col-md-9">
                        <textarea type="text"
                               class="form-control"
                               name="nameEn"
                               id="nameEn"
                               required
                               minlength="2"
                              
                               [(ngModel)]="content.nameEn"
                               #nameEnModel="ngModel"
                               #nameEnEl ></textarea>
                        <abp-validation-summary [control]="nameEnModel"
                                                [controlEl]="nameEnEl"></abp-validation-summary>
                    </div>
                </div>

                

            
        
    </div>
    <abp-modal-footer [cancelDisabled]="saving"
                      [saveDisabled]="!contentForm.form.valid || saving"
                      (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
